services:
  - type: web
    name: intelligent-product-assistant-api
    runtime: node
    rootDir: backend

    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false        # you set this manually in Render dashboard
      - key: GROK_API_KEY
        sync: false        # you set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false        # set to your Vercel URL after frontend deploy
